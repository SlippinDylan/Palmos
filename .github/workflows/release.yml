name: Release

on: # zizmor: ignore[dangerous-triggers] Jobs accept only successful push CI from this repository's main branch.
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan release
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish || 'false' }}
      version: ${{ steps.manifest.outputs.version }}
      marketing_version: ${{ steps.manifest.outputs.marketing_version }}
      channel: ${{ steps.manifest.outputs.channel }}
      tag: ${{ steps.manifest.outputs.tag }}
      prerelease: ${{ steps.manifest.outputs.prerelease }}
      dmg_name: ${{ steps.manifest.outputs.dmg_name }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Read release manifest
        id: manifest
        run: node .github/scripts/release-manifest.mjs validate

      - name: Check existing release
        if: steps.manifest.outputs.release == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          if is_draft="$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$is_draft" == 'true' ]]; then
              echo 'exists=false' >> "$GITHUB_OUTPUT"
              echo 'draft=true' >> "$GITHUB_OUTPUT"
              echo "Draft release $TAG exists; the run will rebuild and finish it."
            else
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              echo 'draft=false' >> "$GITHUB_OUTPUT"
              echo "Published release $TAG already exists; packaging is not required."
            fi
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'draft=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release request
        if: steps.manifest.outputs.release == 'true' && steps.existing.outputs.exists == 'false'
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          visibility="$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq '.visibility')"
          if [[ "$visibility" != 'PUBLIC' ]]; then
            echo 'Palmos must be public before release publishing is enabled.' >&2
            exit 1
          fi
          all_tags="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name')"
          published_tags="$(awk -v current="$CURRENT_TAG" '$0 != current' <<< "$all_tags")"
          PUBLISHED_RELEASE_TAGS="$published_tags" \
            node .github/scripts/release-manifest.mjs plan

  release:
    name: Build and publish DMG
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      MARKETING_VERSION: ${{ needs.plan.outputs.marketing_version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      TAG: ${{ needs.plan.outputs.tag }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      DMG_NAME: ${{ needs.plan.outputs.dmg_name }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Dispatch packaging notification
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --argjson prerelease "$PRERELEASE" \
            --arg dmg_name "$DMG_NAME" \
            --arg sha "$TESTED_SHA" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              event_type: "release_started",
              client_payload: {
                version: $version,
                prerelease: $prerelease,
                dmg_name: $dmg_name,
                sha: $sha,
                run_url: $run_url
              }
            }' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -

      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

      - name: Prepare release notes
        run: |
          release_notes_path="$RUNNER_TEMP/release-notes.md"
          node .github/scripts/release-manifest.mjs notes > "$release_notes_path"
          {
            echo
            echo '## 安装'
            echo
            echo '1. 打开 DMG，将 `Palmos.app` 拖到 `Applications`。'
            echo '2. 移除下载隔离属性：'
            echo
            echo '   ```bash'
            echo '   sudo xattr -rd com.apple.quarantine /Applications/Palmos.app'
            echo '   ```'
            echo
            echo '> 此版本仅支持 Apple Silicon（arm64）。Intel Mac 无法运行；如旧版本曾安装 SMART Helper，请先按 README 的卸载说明清理。'
            echo
            echo '> 此版本使用 Apple Development 证书签名，未经过 Apple 公证。需要时可在设置中安装 SMART Helper。'
          } >> "$release_notes_path"

      - name: Install Apple Development certificate
        env:
          APPLE_DEVELOPMENT_P12_BASE64: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 || secrets.CERTIFICATES_P12 }}
          APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD || secrets.CERTIFICATES_PASSWORD }}
        run: |
          set -euo pipefail

          : "${APPLE_DEVELOPMENT_P12_BASE64:?Missing APPLE_DEVELOPMENT_P12_BASE64 or CERTIFICATES_P12 secret}"
          : "${APPLE_DEVELOPMENT_P12_PASSWORD:?Missing APPLE_DEVELOPMENT_P12_PASSWORD or CERTIFICATES_PASSWORD secret}"

          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-development.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/palmos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_DEVELOPMENT_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_DEVELOPMENT_P12_PASSWORD" \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          IDENTITY_LINE="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk '/"Apple Development:/ && !found { print; found = 1 }'
          )"
          if [[ -z "$IDENTITY_LINE" ]]; then
            echo "Unable to find an Apple Development identity in the imported P12." >&2
            exit 1
          fi

          SIGNING_IDENTITY="$(awk '{ print $2 }' <<< "$IDENTITY_LINE")"
          SIGNING_CERTIFICATE_NAME="$(
            sed -E 's/^[^"]*"([^"]+)".*$/\1/' <<< "$IDENTITY_LINE"
          )"
          SIGNING_TEAM_ID="$(
            security find-certificate \
              -c "$SIGNING_CERTIFICATE_NAME" \
              -p \
              "$KEYCHAIN_PATH" \
              | openssl x509 -noout -subject -nameopt RFC2253 \
              | tr ',' '\n' \
              | awk -F= '$1 == "OU" && !found { print $2; found = 1 }'
          )"

          if [[ -z "$SIGNING_IDENTITY" || -z "$SIGNING_TEAM_ID" ]]; then
            echo "Unable to find an Apple Development identity and Team ID in the imported P12." >&2
            exit 1
          fi

          {
            echo "SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "SIGNING_TEAM_ID=$SIGNING_TEAM_ID"
          } >> "$GITHUB_ENV"

          rm -f "$CERTIFICATE_PATH"

      - name: Build and sign smartctl companion
        run: |
          set -euo pipefail

          COMPANION_OUTPUT_DIRECTORY="$RUNNER_TEMP/smartctl-companion"
          Scripts/build-smartctl-companion.sh "$COMPANION_OUTPUT_DIRECTORY"

          COMPANION_PATH="$COMPANION_OUTPUT_DIRECTORY/smartctl"
          SOURCE_ARCHIVE="$COMPANION_OUTPUT_DIRECTORY/smartmontools-7.5.tar.gz"
          cmp \
            "$COMPANION_OUTPUT_DIRECTORY/smartmontools-COPYING.txt" \
            Shared/Licensing/smartmontools-COPYING.txt

          codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --identifier com.palmos.smartservice.smartctl \
            --options runtime \
            --timestamp=none \
            --keychain "$SIGNING_KEYCHAIN_PATH" \
            "$COMPANION_PATH"
          codesign --verify --strict --verbose=2 "$COMPANION_PATH"
          COMPANION_SHA256="$(shasum -a 256 "$COMPANION_PATH" | awk '{ print $1 }')"

          {
            echo "SMARTCTL_COMPANION_PATH=$COMPANION_PATH"
            echo "SMARTCTL_COMPANION_SHA256=$COMPANION_SHA256"
            echo "SMARTMONTOOLS_SOURCE_ARCHIVE_PATH=$SOURCE_ARCHIVE"
          } >> "$GITHUB_ENV"

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Palmos.xcworkspace \
            -scheme PalmosApp \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            PALMOS_UPDATE_CHANNEL="$CHANNEL" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$SIGNING_TEAM_ID" \
            TEAM_IDENTIFIER="$SIGNING_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN_PATH" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SMARTCTL_COMPANION_PATH="$SMARTCTL_COMPANION_PATH" \
            SMARTCTL_COMPANION_SHA256="$SMARTCTL_COMPANION_SHA256" \
            SMARTMONTOOLS_SOURCE_ARCHIVE_PATH="$SMARTMONTOOLS_SOURCE_ARCHIVE_PATH" \
            SMARTCTL_COMPANION_REQUIRED_FOR_SIGNED_BUILD=YES

      - name: Sign embedded Sparkle components
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/Palmos.app"
          framework="$app/Contents/Frameworks/Sparkle.framework"
          keychain="$SIGNING_KEYCHAIN_PATH"
          test -d "$framework"
          component_identifier() {
            codesign --display --verbose=4 "$1" 2>&1 \
              | sed -n 's/^Identifier=//p' \
              | head -n 1
          }
          installer="$framework/Versions/B/XPCServices/Installer.xpc"
          downloader="$framework/Versions/B/XPCServices/Downloader.xpc"
          autoupdate="$framework/Versions/B/Autoupdate"
          updater="$framework/Versions/B/Updater.app"
          installer_identifier="$(component_identifier "$installer")"
          downloader_identifier="$(component_identifier "$downloader")"
          autoupdate_identifier="$(component_identifier "$autoupdate")"
          updater_identifier="$(component_identifier "$updater")"
          framework_identifier="$(component_identifier "$framework")"
          for identifier in "$installer_identifier" "$downloader_identifier" "$autoupdate_identifier" "$updater_identifier" "$framework_identifier"; do
            test -n "$identifier"
          done
          # Sparkle 2.10 requires its nested code to be signed inside out. The
          # Downloader entitlement and each distributed code identifier are retained.
          codesign --force --sign "$SIGNING_IDENTITY" --identifier "$installer_identifier" --options runtime --keychain "$keychain" \
            --preserve-metadata=entitlements \
            "$installer"
          codesign --force --sign "$SIGNING_IDENTITY" --identifier "$downloader_identifier" --options runtime --keychain "$keychain" \
            --preserve-metadata=entitlements \
            "$downloader"
          codesign --force --sign "$SIGNING_IDENTITY" --identifier "$autoupdate_identifier" --options runtime --keychain "$keychain" \
            --preserve-metadata=entitlements \
            "$autoupdate"
          codesign --force --sign "$SIGNING_IDENTITY" --identifier "$updater_identifier" --options runtime --keychain "$keychain" \
            --preserve-metadata=entitlements \
            "$updater"
          codesign --force --sign "$SIGNING_IDENTITY" --identifier "$framework_identifier" --options runtime --keychain "$keychain" \
            "$framework"
          codesign --force --sign "$SIGNING_IDENTITY" --options runtime --keychain "$keychain" \
            --preserve-metadata=identifier,entitlements,flags,runtime \
            "$app"

      - name: Verify Release signatures
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release/Palmos.app"
          Scripts/verify/code-signing.sh "$APP_PATH" "$SIGNING_TEAM_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")" = "$MARKETING_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist")" = "${{ github.run_number }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :PalmosUpdateChannel' "$APP_PATH/Contents/Info.plist")" = "$CHANNEL"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$APP_PATH/Contents/Info.plist")" = 'https://slippindylan.github.io/homebrew-tap/palmos/appcast.xml'
          assert_sparkle_component() {
            local component="$1"
            local expected_identifier="$2"
            codesign --verify --strict --all-architectures --verbose=2 "$component"
            signature="$RUNNER_TEMP/$(basename "$component").signature.txt"
            codesign --display --verbose=4 "$component" > /dev/null 2> "$signature"
            grep -Fq "TeamIdentifier=$SIGNING_TEAM_ID" "$signature"
            grep -Fq "Identifier=$expected_identifier" "$signature"
          }
          assert_sparkle_component "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc" 'org.sparkle-project.InstallerLauncher'
          assert_sparkle_component "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc" 'org.sparkle-project.DownloaderService'
          assert_sparkle_component "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate" 'Autoupdate-55554944f723d84042cd352fbb0485760ff7597a'
          assert_sparkle_component "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app" 'org.sparkle-project.Sparkle.Updater'
          assert_sparkle_component "$APP_PATH/Contents/Frameworks/Sparkle.framework" 'org.sparkle-project.Sparkle'

      - name: Package DMG
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release/Palmos.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "Built app bundle not found at $APP_PATH." >&2
            exit 1
          fi

          Scripts/create-dmg.sh "$APP_PATH" "$RUNNER_TEMP/$DMG_NAME" "Palmos"
          hdiutil verify "$RUNNER_TEMP/$DMG_NAME"

          MOUNT_POINT="$RUNNER_TEMP/PalmosDMG"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach \
            -readonly \
            -nobrowse \
            -mountpoint "$MOUNT_POINT" \
            "$RUNNER_TEMP/$DMG_NAME"
          cleanup_mount() { hdiutil detach "$MOUNT_POINT" >/dev/null; }
          trap cleanup_mount EXIT
          test -d "$MOUNT_POINT/Palmos.app"
          test "$(readlink "$MOUNT_POINT/Applications")" = '/Applications'
          Scripts/verify/code-signing.sh "$MOUNT_POINT/Palmos.app" "$SIGNING_TEAM_ID"
          cleanup_mount
          trap - EXIT

      - name: Recheck release availability
        id: availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if is_draft="$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$is_draft" != 'true' ]]; then
              echo "Published release $TAG was created while this run was queued." >&2
              exit 1
            fi
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
            if [[ "$tag_sha" != "$TESTED_SHA" ]]; then
              echo "Draft release $TAG targets $tag_sha instead of tested commit $TESTED_SHA." >&2
              exit 1
            fi
            echo 'draft=true' >> "$GITHUB_OUTPUT"
          elif tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$tag_sha" != "$TESTED_SHA" ]]; then
              echo "Existing tag $TAG targets $tag_sha instead of tested commit $TESTED_SHA." >&2
              exit 1
            fi
          fi

      - name: Create draft GitHub Release
        if: steps.availability.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arguments=(
            release create "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$TESTED_SHA"
            --title "Palmos $TAG"
            --notes-file "$RUNNER_TEMP/release-notes.md"
            --draft
          )
          if [[ "$PRERELEASE" == 'true' ]]; then
            arguments+=(--prerelease)
          fi
          arguments+=("$RUNNER_TEMP/$DMG_NAME#$DMG_NAME")
          gh "${arguments[@]}"

      - name: Refresh existing draft GitHub Release
        if: steps.availability.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$RUNNER_TEMP/$DMG_NAME#$DMG_NAME"
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Palmos $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease="$PRERELEASE"

      - name: Verify draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = 'true'
          asset_names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if [[ "$asset_names" != "$DMG_NAME" ]]; then
            echo "Draft release assets must contain only $DMG_NAME; found: $asset_names" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Request distribution metadata publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n --arg tag "$TAG" '{event_type: "distribution_metadata_requested", client_payload: {tag: $tag}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -

      - name: Dispatch release notification
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changelog="$(node .github/scripts/release-manifest.mjs notes)"
          jq -n \
            --arg version "$VERSION" \
            --argjson prerelease "$PRERELEASE" \
            --arg dmg_name "$DMG_NAME" \
            --arg changelog "$changelog" \
            --arg release_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --arg download_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${DMG_NAME}" \
            '{
              event_type: "release_published",
              client_payload: {
                version: $version,
                prerelease: $prerelease,
                dmg_name: $dmg_name,
                changelog: $changelog,
                release_url: $release_url,
                download_url: $download_url
              }
            }' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -

      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" && -f "$SIGNING_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/apple-development.p12"
