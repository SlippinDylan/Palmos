name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    # macos-26 is required because macOS 26 is the deployment target.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pin to a specific Xcode to avoid silent breakage on runner image updates.
      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

      - name: Validate Local SMART Build Entry Point
        run: |
          bash -n Scripts/build-local-smart-app.sh
          bash -n Scripts/build-smartctl-companion.sh
          bash -n Scripts/create-dmg.sh
          bash -n Scripts/verify/create-dmg-tests.sh
          bash -n Scripts/verify/code-signing.sh
          bash -n Scripts/verify/code-signing-tests.sh
          bash -n Scripts/verify/local-smart-build-tests.sh
          Scripts/build-local-smart-app.sh --help >/dev/null
          Scripts/verify/create-dmg-tests.sh
          Scripts/verify/code-signing-tests.sh
          Scripts/verify/local-smart-build-tests.sh

      - name: Validate Automation
        run: |
          node .github/scripts/release-manifest.mjs validate
          node --test .github/scripts/*.test.mjs

      - name: Run PalmosCore Tests
        working-directory: Packages/PalmosCore
        run: swift test

      - name: Run PalmosApp Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Palmos.xcworkspace \
            -scheme PalmosApp \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Run PalmosSMARTService Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Palmos.xcworkspace \
            -scheme PalmosSMARTServiceTests \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build unsigned arm64 app
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Palmos.xcworkspace \
            -scheme PalmosApp \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Release" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify unsigned arm64 artifact
        run: |
          app="$RUNNER_TEMP/DerivedData-Release/Build/Products/Release/Palmos.app"
          app_binary="$app/Contents/MacOS/Palmos"
          helper="$app/Contents/Library/LaunchServices/com.palmos.smartservice"
          test "$(lipo -archs "$app_binary")" = 'arm64'
          test "$(lipo -archs "$helper")" = 'arm64'
          test "$(vtool -show-build "$app_binary" | grep -c 'minos 26.0')" -eq 1
          test "$(vtool -show-build "$helper" | grep -c 'minos 26.0')" -eq 1
