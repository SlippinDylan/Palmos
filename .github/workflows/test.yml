name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightweight-check:
    name: Lightweight Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_macos: ${{ steps.changes.outputs.run_macos }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/changed-files"

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            run_macos=true
          else
            if [[ "$EVENT_NAME" == 'pull_request' ]]; then
              git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_files"
            elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              git diff --name-only -z "$BEFORE_SHA" "$CURRENT_SHA" > "$changed_files"
            elif git rev-parse "${CURRENT_SHA}^" >/dev/null 2>&1; then
              git diff --name-only -z "${CURRENT_SHA}^" "$CURRENT_SHA" > "$changed_files"
            else
              git ls-tree -r --name-only -z "$CURRENT_SHA" > "$changed_files"
            fi

            run_macos=false
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md | LICENSE | AGENTS.md | docs/*) ;;
                *) run_macos=true; break ;;
              esac
            done < "$changed_files"

            if node -e "const manifest = require('./Config/Release/manifest.json'); process.exit(manifest.release === true ? 0 : 1)"; then
              run_macos=true
            fi
          fi

          echo "run_macos=$run_macos" >> "$GITHUB_OUTPUT"

      - name: Validate automation
        run: |
          bash -n Scripts/build-local-smart-app.sh
          bash -n Scripts/build-smartctl-companion.sh
          bash -n Scripts/create-dmg.sh
          bash -n Scripts/verify/create-dmg-tests.sh
          bash -n Scripts/verify/code-signing.sh
          bash -n Scripts/verify/code-signing-tests.sh
          bash -n Scripts/verify/local-smart-build-tests.sh
          Scripts/build-local-smart-app.sh --help >/dev/null
          node .github/scripts/release-manifest.mjs validate
          node .github/scripts/sync-version.mjs --check
          node --test .github/scripts/*.test.mjs

  macos-check:
    name: Test and build Palmos
    needs: lightweight-check
    if: needs.lightweight-check.outputs.run_macos == 'true'
    # macos-26 is required because macOS 26 is the deployment target.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pin to a specific Xcode to avoid silent breakage on runner image updates.
      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

      - name: Report toolchain
        run: |
          xcodebuild -version
          node --version

      - name: Validate SMART build and packaging
        run: |
          Scripts/verify/create-dmg-tests.sh
          Scripts/verify/code-signing-tests.sh
          Scripts/verify/local-smart-build-tests.sh

      - name: Build smartctl companion
        run: |
          output="$RUNNER_TEMP/smartctl-companion"
          Scripts/build-smartctl-companion.sh "$output"
          test "$(lipo -archs "$output/smartctl")" = 'arm64'
          test "$(vtool -show-build "$output/smartctl" | grep -c 'minos 26.0')" -eq 1
          cmp "$output/smartmontools-COPYING.txt" Shared/Licensing/smartmontools-COPYING.txt

      - name: Run PalmosCore tests
        working-directory: Packages/PalmosCore
        run: swift test

      - name: Run PalmosApp tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Palmos.xcworkspace \
            -scheme PalmosApp \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Run PalmosSMARTService tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Palmos.xcworkspace \
            -scheme PalmosSMARTServiceTests \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build unsigned arm64 app
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Palmos.xcworkspace \
            -scheme PalmosApp \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Release" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify unsigned arm64 artifact
        run: |
          app="$RUNNER_TEMP/DerivedData-Release/Build/Products/Release/Palmos.app"
          app_binary="$app/Contents/MacOS/Palmos"
          helper="$app/Contents/Library/LaunchServices/com.palmos.smartservice"
          test "$(lipo -archs "$app_binary")" = 'arm64'
          test "$(lipo -archs "$helper")" = 'arm64'
          test "$(vtool -show-build "$app_binary" | grep -c 'minos 26.0')" -eq 1
          test "$(vtool -show-build "$helper" | grep -c 'minos 26.0')" -eq 1
          otool -l "$app_binary" | grep -A2 'cmd LC_RPATH' | grep -q '@executable_path/../Frameworks'
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = '26.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$app/Contents/Info.plist")" = 'https://slippindylan.github.io/homebrew-tap/palmos/appcast.xml'
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$app/Contents/Info.plist")" = 'EagyaGi+/pVuyXbZArnqGZ1g4QzJNYvRrrW1//SHfJ8='
          test "$(/usr/libexec/PlistBuddy -c 'Print :SURequireSignedFeed' "$app/Contents/Info.plist")" = 'true'
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUVerifyUpdateBeforeExtraction' "$app/Contents/Info.plist")" = 'true'
          test -d "$app/Contents/Frameworks/Sparkle.framework"

  build-check:
    name: Build Check
    needs:
      - lightweight-check
      - macos-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify CI result
        env:
          LIGHTWEIGHT_RESULT: ${{ needs.lightweight-check.result }}
          MACOS_RESULT: ${{ needs.macos-check.result }}
        run: |
          test "$LIGHTWEIGHT_RESULT" = 'success'
          [[ "$MACOS_RESULT" == 'success' || "$MACOS_RESULT" == 'skipped' ]]
